<title>One-unit tanh network — loss surface</title>

<style>
  :root {
    color-scheme: light;
    --surface:      #fbfbfa;
    --panel:        #f2f3f5;
    --line:         #dfe1e6;
    --ink:          #101216;
    --ink-2:        #565d6b;
    --ink-3:        #868d9b;
    --accent:       #2a78d6;
    --void:         #eef0f4;
    --ramp-0:  #cde2fb; --ramp-1:  #9ec5f4; --ramp-2:  #6da7ec;
    --ramp-3:  #3987e5; --ramp-4:  #256abf; --ramp-5:  #184f95;
    --ramp-6:  #0d366b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #101113;
      --panel:   #191b1f;
      --line:    #2b2f36;
      --ink:     #f2f3f5;
      --ink-2:   #a7aeba;
      --ink-3:   #6f7783;
      --accent:  #4d95e8;
      --void:    #0a0b0d;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #101113;
    --panel:   #191b1f;
    --line:    #2b2f36;
    --ink:     #f2f3f5;
    --ink-2:   #a7aeba;
    --ink-3:   #6f7783;
    --accent:  #4d95e8;
    --void:    #0a0b0d;
  }

  body {
    background: var(--surface);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--line);
    padding: 18px 22px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 18px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .eq {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
    font-size: 12.5px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .eq b { color: var(--ink); font-weight: 500; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 232px 1fr;
    min-height: 0;
  }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
    #rail { border-right: 0; border-bottom: 1px solid var(--line); }
  }

  #rail {
    border-right: 1px solid var(--line);
    padding: 18px 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--panel);
  }
  .ctrl { display: flex; flex-direction: column; gap: 7px; }
  .ctrl-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-3);
    font-weight: 600;
  }
  .val {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    margin: 0;
  }
  input[type="range"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  button {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .toggle { display: flex; align-items: center; gap: 9px; }
  .toggle input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
  .toggle label { text-transform: none; letter-spacing: 0; font-size: 12px;
                  font-weight: 400; color: var(--ink-2); cursor: pointer; }
  .toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #warn {
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--ink-2);
    border-left: 2px solid var(--accent);
    padding: 2px 0 2px 10px;
  }
  #warn:empty { display: none; }

  .hint {
    font-size: 11.5px;
    color: var(--ink-3);
    line-height: 1.6;
    margin-top: auto;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .hint kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 4px;
  }

  #stage { position: relative; background: var(--void); min-height: 420px; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  #readout {
    position: absolute;
    left: 14px;
    bottom: 12px;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    pointer-events: none;
    line-height: 1.7;
  }
</style>

<header>
  <h1>One-unit tanh network — loss surface</h1>
  <span class="eq">
    <b>K(w)</b> = ½·E<sub>x~N(0,1)</sub>[ w₂·tanh(w₁x) ]²  =  ½·w₂²·g(w₁),
    &nbsp; g(w₁) = E[tanh²(w₁x)] = 1 − √(2/π)/|w₁| + … &nbsp;·&nbsp; linear z
  </span>
</header>

<main>
  <div id="rail">
    <div class="ctrl">
      <div class="ctrl-head"><label for="e1">w₁ half-width</label>
        <span class="val" id="e1-v">8</span></div>
      <input type="range" id="e1" min="0" max="100" step="1" value="30">
    </div>

    <div class="ctrl">
      <div class="ctrl-head"><label for="e2">w₂ half-width</label>
        <span class="val" id="e2-v">8</span></div>
      <input type="range" id="e2" min="0" max="100" step="1" value="30">
    </div>

    <div class="ctrl">
      <div class="ctrl-head"><label for="zscale">Vertical scale</label>
        <span class="val" id="zscale-v">1.00×</span></div>
      <input type="range" id="zscale" min="0.1" max="3" step="0.05" value="1">
    </div>

    <div class="ctrl">
      <div class="ctrl-head"><label for="res">Mesh</label>
        <span class="val" id="res-v">120 × 120</span></div>
      <input type="range" id="res" min="30" max="260" step="10" value="120">
    </div>

    <div class="toggle">
      <input type="checkbox" id="focus">
      <label for="focus">Concentrate mesh near origin</label>
    </div>

    <div class="ctrl">
      <div class="ctrl-head"><label for="elev">Elevation</label>
        <span class="val" id="elev-v">24°</span></div>
      <input type="range" id="elev" min="-5" max="88" step="1" value="24">
    </div>

    <button type="button" id="reset">Reset view</button>
    <div id="warn"></div>

    <p class="hint">
      <kbd>drag</kbd> rotate &nbsp;·&nbsp; <kbd>scroll</kbd> zoom<br>
      Surface colour tracks height only; it carries no extra information.
    </p>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="readout"></div>
  </div>
</main>

<script>
(() => {
  "use strict";

  // --- the model -------------------------------------------------------------
  // K(w1,w2) = 1/2 E_x[(w2 tanh(w1 x))^2] = 1/2 w2^2 g(w1),  x ~ N(0,1).
  // K is exactly quadratic in w2, so only g(w1) = E[tanh^2(w1 x)] needs quadrature.
  //
  // Gauss-HERMITE is the obvious choice here and it is WRONG for |w1| >~ 2: as w1
  // grows, tanh^2(w1 x) approaches a step function of x, and no polynomial rule can
  // follow that. A 20-node Hermite rule reports g(10) = 0.998 against a true 0.921,
  // and g(100) = 1 exactly against a true 0.992 -- it manufactures a saturation that
  // is not there. See logs/006.
  //
  // Instead integrate the *complement*, which is where the structure lives:
  //     1 - g(a) = E[sech^2(a x)] = (2/a) * int_0^U sech^2(u) phi(u/a) du,  u = a x
  // with U = min(20, 8a). sech^2 decays like 4 e^{-2u}, so U = 20 truncates below
  // 1e-17, and the integrand is smooth on [0, U] for every a. 48-node Gauss-Legendre
  // then holds ~1e-14 from a = 0.01 to a = 1e4, checked against scipy.
  function gaussLegendre(n) {
    const x = new Float64Array(n), w = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let z = Math.cos(Math.PI * (i + 0.75) / (n + 0.5)), pp = 0;
      for (let it = 0; it < 100; it++) {
        let p0 = 1, p1 = 0;
        for (let k = 0; k < n; k++) {
          const p2 = p1; p1 = p0;
          p0 = ((2 * k + 1) * z * p1 - k * p2) / (k + 1);
        }
        pp = n * (z * p0 - p1) / (z * z - 1);
        const dz = p0 / pp; z -= dz;
        if (Math.abs(dz) < 1e-15) break;
      }
      x[i] = z; w[i] = 2 / ((1 - z * z) * pp * pp);
    }
    return { x, w };
  }
  const GL = gaussLegendre(48);
  const INV_SQRT_2PI = 0.3989422804014327;

  function g(w1) {
    const a = Math.abs(w1);
    if (a === 0) return 0;
    const U = Math.min(20, 8 * a);
    let s = 0;
    for (let k = 0; k < GL.x.length; k++) {
      const u = 0.5 * U * (GL.x[k] + 1), wt = 0.5 * U * GL.w[k];
      const t = u / a, ch = Math.cosh(u);
      s += wt * Math.exp(-t * t / 2) * INV_SQRT_2PI / (ch * ch);
    }
    return 1 - (2 / a) * s;
  }

  // --- palette ---------------------------------------------------------------
  const css = getComputedStyle(document.documentElement);
  let RAMP = [], INK, INK3, LINE;
  function readTokens() {
    RAMP = [];
    for (let i = 0; i <= 6; i++) {
      RAMP.push(hexToRgb(css.getPropertyValue("--ramp-" + i).trim()));
    }
    INK  = css.getPropertyValue("--ink").trim();
    INK3 = css.getPropertyValue("--ink-3").trim();
    LINE = css.getPropertyValue("--line").trim();
  }
  function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16),
            parseInt(h.slice(5, 7), 16)];
  }
  function ramp(t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const s = t * (RAMP.length - 1), i = Math.min(Math.floor(s), RAMP.length - 2);
    const f = s - i, a = RAMP[i], b = RAMP[i + 1];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f,
            a[2] + (b[2] - a[2]) * f];
  }

  // --- mesh ------------------------------------------------------------------
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const readout = document.getElementById("readout");

  let e1 = 8, e2 = 8, res = 120, zscale = 1, focus = false;
  let yaw = 0.62, pitch = 24 * Math.PI / 180, zoom = 1;
  let ax1 = [], ax2 = [], zs = [], kmax = 1, dxMin1 = 1;

  // Grid along one axis. `focus` bends the spacing toward the origin (cubic in the
  // normalised coordinate) so the pinch at w1 = 0 stays resolved at large domains.
  function axis(half) {
    const n = res + 1, a = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const t = -1 + (2 * i) / res;
      a[i] = focus ? half * Math.sign(t) * Math.abs(t) ** 3 : half * t;
    }
    return a;
  }

  function rebuild() {
    const n = res + 1;
    ax1 = axis(e1);
    ax2 = axis(e2);

    const gv = new Float64Array(n);
    for (let i = 0; i < n; i++) gv[i] = g(ax1[i]);

    zs = new Float64Array(n * n);
    kmax = 0;
    for (let i = 0; i < n; i++) {          // i indexes w1
      for (let j = 0; j < n; j++) {        // j indexes w2
        const v = 0.5 * ax2[j] * ax2[j] * gv[i];
        zs[i * n + j] = v;
        if (v > kmax) kmax = v;
      }
    }

    dxMin1 = Infinity;
    for (let i = 0; i < n - 1; i++) {
      const d = ax1[i + 1] - ax1[i];
      if (d < dxMin1) dxMin1 = d;
    }
    checkResolution();
  }

  // The only feature in this landscape lives at |w1| < ~3, where g(w1) climbs from 0
  // to its saturation value of 1. Past that the surface is a plain parabolic trough.
  // Say so when the mesh stops resolving it (CONSTITUTION 8a: rendering choices that
  // change what you see have to be stated).
  function checkResolution() {
    const span = Math.min(3, e1);
    let inside = 0;
    for (let i = 0; i < ax1.length; i++) if (Math.abs(ax1[i]) <= span) inside++;
    const w = document.getElementById("warn");
    if (inside < 12) {
      w.textContent = "Only " + inside + " grid points fall in |w₁| < 3, where most " +
        "of the variation in g is. What you are seeing there is the mesh, not the " +
        "function. Raise the mesh or turn on origin concentration.";
    } else {
      w.textContent = "";
    }
  }

  // --- projection ------------------------------------------------------------
  // Yaw about the vertical axis, then tilt by `pitch`. Orthographic.
  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W * dpr || cv.height !== H * dpr) {
      cv.width = W * dpr; cv.height = H * dpr;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const n = res + 1;
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);

    // World units: true aspect between w1 and w2; z stretched so the surface reads
    // at a comparable size whatever the domain. Linear in K throughout.
    const eMax = Math.max(e1, e2);
    const zUnit = kmax > 0 ? (eMax * 1.1 / kmax) * zscale : 1;
    const scale = (Math.min(W, H) * 0.62 / (eMax * 1.9)) * zoom;
    const cx = W / 2, cyc = H / 2 + Math.min(W, H) * 0.10;

    const px = new Float64Array(n * n);
    const py = new Float64Array(n * n);
    const pd = new Float64Array(n * n);
    for (let i = 0; i < n; i++) {
      const x = ax1[i];
      for (let j = 0; j < n; j++) {
        const y = ax2[j], z = zs[i * n + j] * zUnit;
        const u = x * cy + y * sy;
        const v = -x * sy + y * cy;
        const idx = i * n + j;
        px[idx] = cx + u * scale;
        py[idx] = cyc - (z * cp + v * sp) * scale;
        pd[idx] = -v * cp + z * sp;          // larger = closer to camera
      }
    }

    const nq = res * res;
    const order = new Int32Array(nq);
    const key = new Float64Array(nq);
    for (let i = 0; i < res; i++) {
      for (let j = 0; j < res; j++) {
        const q = i * res + j;
        order[q] = q;
        key[q] = 0.25 * (pd[i * n + j] + pd[(i + 1) * n + j] +
                         pd[(i + 1) * n + j + 1] + pd[i * n + j + 1]);
      }
    }
    const idxArr = Array.from(order);
    idxArr.sort((a, b) => key[a] - key[b]);   // far first

    const light = [0.42, -0.55, 0.72];

    for (let q = 0; q < nq; q++) {
      const t = idxArr[q];
      const i = (t / res) | 0, j = t % res;
      const a = i * n + j, b = (i + 1) * n + j,
            c = (i + 1) * n + j + 1, d = i * n + j + 1;

      const zA = zs[a], zB = zs[b], zD = zs[d];
      // Surface normal of z = f(x,y): (-df/dx, -df/dy, 1), scaled by zUnit.
      // Spacing is per-cell because the mesh can be non-uniform.
      const h1 = (ax1[i + 1] - ax1[i]) || 1e-12;
      const h2 = (ax2[j + 1] - ax2[j]) || 1e-12;
      let nx = -(zB - zA) / h1 * zUnit, ny = -(zD - zA) / h2 * zUnit, nz = 1;
      // Rotate the normal with the model so lighting follows the view.
      const rx = nx * cy + ny * sy, ry = -nx * sy + ny * cy;
      const len = Math.hypot(rx, ry, nz) || 1;
      let lam = (rx * light[0] + ry * light[1] * cp + nz * light[2]) / len;
      lam = 0.62 + 0.38 * Math.max(lam, 0);

      const zMid = 0.25 * (zA + zB + zs[c] + zD);
      const col = ramp(kmax > 0 ? zMid / kmax : 0);
      ctx.fillStyle = "rgb(" + (col[0] * lam | 0) + "," + (col[1] * lam | 0) +
                      "," + (col[2] * lam | 0) + ")";
      ctx.beginPath();
      ctx.moveTo(px[a], py[a]);
      ctx.lineTo(px[b], py[b]);
      ctx.lineTo(px[c], py[c]);
      ctx.lineTo(px[d], py[d]);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }

    drawAxes(W, H, cx, cyc, scale, cy, sy, cp, sp);

    readout.textContent =
      "w₁ ∈ ±" + fmt(e1) + "   w₂ ∈ ±" + fmt(e2) + "   " +
      "max K = " + kmax.toPrecision(4) + "\n" +
      "mesh " + res + "×" + res +
      "   Δw₁ near 0 = " + dxMin1.toPrecision(3) +
      "   zoom " + zoom.toFixed(2) + "×";
  }

  function drawAxes(W, H, cx, cyc, scale, cy, sy, cp, sp) {
    const proj = (x, y, z) => {
      const u = x * cy + y * sy, v = -x * sy + y * cy;
      return [cx + u * scale, cyc - (z * cp + v * sp) * scale];
    };
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    ctx.beginPath();
    const corners = [[-e1, -e2], [e1, -e2], [e1, e2], [-e1, e2]];
    for (let k = 0; k < 4; k++) {
      const p = proj(corners[k][0], corners[k][1], 0);
      const q = proj(corners[(k + 1) % 4][0], corners[(k + 1) % 4][1], 0);
      ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
    }
    ctx.stroke();

    ctx.fillStyle = INK3;
    ctx.font = "500 11px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const lx = proj(e1 * 1.16, 0, 0), ly = proj(0, e2 * 1.16, 0);
    ctx.fillText("w₁", lx[0], lx[1]);
    ctx.fillText("w₂", ly[0], ly[1]);
    const lz = proj(-e1, -e2, 0);
    ctx.fillText("K", lz[0] - 16, lz[1] - 10);
  }

  // --- interaction -----------------------------------------------------------
  let dragging = false, lastX = 0, lastY = 0;
  cv.addEventListener("pointerdown", (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    yaw += (e.clientX - lastX) * 0.008;
    pitch = Math.max(-0.09, Math.min(1.53, pitch - (e.clientY - lastY) * 0.006));
    lastX = e.clientX; lastY = e.clientY;
    syncElev();
    draw();
  });
  cv.addEventListener("pointerup", (e) => {
    dragging = false; cv.releasePointerCapture(e.pointerId);
  });
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoom = Math.max(0.25, Math.min(8, zoom * Math.exp(-e.deltaY * 0.0016)));
    draw();
  }, { passive: false });

  const el = (id) => document.getElementById(id);
  function bind(id, fmt, onInput) {
    const input = el(id), out = el(id + "-v");
    input.addEventListener("input", () => {
      out.textContent = fmt(parseFloat(input.value));
      onInput(parseFloat(input.value));
      draw();
    });
  }
  // Half-width sliders are logarithmic: slider 0..100 maps to 1 .. 1000.
  const half = (s) => Math.pow(10, (s / 100) * 3);
  const fmt = (v) => v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);

  bind("e1", (s) => fmt(half(s)), (s) => { e1 = half(s); rebuild(); });
  bind("e2", (s) => fmt(half(s)), (s) => { e2 = half(s); rebuild(); });
  bind("zscale", (v) => v.toFixed(2) + "×", (v) => { zscale = v; });
  bind("res", (v) => v + " × " + v, (v) => { res = v; rebuild(); });
  bind("elev", (v) => v + "°", (v) => { pitch = v * Math.PI / 180; });

  el("focus").addEventListener("change", (e) => {
    focus = e.target.checked; rebuild(); draw();
  });

  function syncElev() {
    const deg = Math.round(pitch * 180 / Math.PI);
    el("elev").value = deg;
    el("elev-v").textContent = deg + "°";
  }

  el("reset").addEventListener("click", () => {
    yaw = 0.62; pitch = 24 * Math.PI / 180; zoom = 1;
    syncElev(); draw();
  });

  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener("change", () => { readTokens(); draw(); });
  new MutationObserver(() => { readTokens(); draw(); })
    .observe(document.documentElement, { attributes: true,
                                         attributeFilter: ["data-theme"] });
  window.addEventListener("resize", draw);

  readTokens();
  e1 = half(parseFloat(el("e1").value));
  e2 = half(parseFloat(el("e2").value));
  el("e1-v").textContent = fmt(e1);
  el("e2-v").textContent = fmt(e2);
  rebuild();
  draw();
})();
</script>
