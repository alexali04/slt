<title>Edge of stability on a singular loss surface</title>

<style>
  :root {
    color-scheme: light;
    --surface: #fbfbfa; --panel: #f2f3f5; --line: #dfe1e6;
    --ink: #101216; --ink-2: #565d6b; --ink-3: #868d9b;
    --accent: #2a78d6; --path: #eb6834; --limit: #d33a48; --void: #eef0f4;
    --ramp-0:#cde2fb; --ramp-1:#9ec5f4; --ramp-2:#6da7ec; --ramp-3:#3987e5;
    --ramp-4:#256abf; --ramp-5:#184f95; --ramp-6:#0d366b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface:#101113; --panel:#191b1f; --line:#2b2f36;
      --ink:#f2f3f5; --ink-2:#a7aeba; --ink-3:#6f7783;
      --accent:#4d95e8; --path:#f58150; --limit:#f0666f; --void:#0a0b0d;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:#101113; --panel:#191b1f; --line:#2b2f36;
    --ink:#f2f3f5; --ink-2:#a7aeba; --ink-3:#6f7783;
    --accent:#4d95e8; --path:#f58150; --limit:#f0666f; --void:#0a0b0d;
  }

  body {
    background: var(--surface); color: var(--ink); margin: 0;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.5; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--line); padding: 16px 22px 13px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 18px;
  }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .eq {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; color: var(--ink-2);
  }
  .eq b { color: var(--ink); font-weight: 500; }

  main { flex: 1; display: grid; grid-template-columns: 244px 1fr; min-height: 0; }
  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; }
    #rail { border-right: 0; border-bottom: 1px solid var(--line); }
  }

  #rail {
    border-right: 1px solid var(--line); background: var(--panel);
    padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 15px;
    overflow-y: auto;
  }
  .grp { display: flex; flex-direction: column; gap: 12px; }
  .grp-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--ink-3); font-weight: 700; border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  .ctrl { display: flex; flex-direction: column; gap: 6px; }
  .ctrl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-3); font-weight: 600;
  }
  .val {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .row { display: flex; gap: 7px; }
  button {
    font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 5px; padding: 7px 11px;
    cursor: pointer; flex: 1;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  .toggle { display: flex; align-items: center; gap: 8px; }
  .toggle input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
  .toggle label {
    text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 400;
    color: var(--ink-2); cursor: pointer;
  }

  #stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #view { position: relative; flex: 1; background: var(--void); min-height: 330px; }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #cv:active { cursor: grabbing; }
  #plotwrap {
    height: 168px; border-top: 1px solid var(--line);
    position: relative; background: var(--surface);
  }
  #plot { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11.5px; font-variant-numeric: tabular-nums; line-height: 1.75;
    pointer-events: none;
  }
  #readout { left: 14px; top: 12px; color: var(--ink-2); }
  #readout .k { color: var(--ink-3); }
  #readout .hot { color: var(--limit); font-weight: 600; }
  #note { left: 14px; bottom: 10px; color: var(--ink-3); font-size: 11px; }
</style>

<header>
  <h1>Edge of stability on a singular loss surface</h1>
  <span class="eq">
    one-unit tanh net &nbsp;<b>f(x) = w₂·tanh(w₁x)</b>&nbsp; fitting pure noise
    &nbsp;·&nbsp; empirical loss over n samples &nbsp;·&nbsp; linear z
  </span>
</header>

<main>
  <div id="rail">
    <div class="grp">
      <div class="grp-title">Data — the noise in the landscape</div>
      <div class="ctrl">
        <div class="ctrl-head"><label for="n">Samples n</label><span class="val" id="n-v">400</span></div>
        <input type="range" id="n" min="20" max="2000" step="20" value="400">
      </div>
      <div class="ctrl">
        <div class="ctrl-head"><label for="sig">Label noise σ</label><span class="val" id="sig-v">0.30</span></div>
        <input type="range" id="sig" min="0" max="1" step="0.02" value="0.3">
      </div>
      <div class="ctrl">
        <div class="ctrl-head"><label for="seed">Seed</label><span class="val" id="seed-v">1</span></div>
        <input type="range" id="seed" min="1" max="40" step="1" value="1">
      </div>
    </div>

    <div class="grp">
      <div class="grp-title">Descent</div>
      <div class="ctrl">
        <div class="ctrl-head"><label for="lr">Learning rate η</label><span class="val" id="lr-v">0.050</span></div>
        <input type="range" id="lr" min="0.005" max="0.2" step="0.001" value="0.05">
      </div>
      <div class="ctrl">
        <div class="ctrl-head"><label for="bs">Batch</label><span class="val" id="bs-v">full</span></div>
        <input type="range" id="bs" min="0" max="10" step="1" value="10">
      </div>
      <div class="ctrl">
        <div class="ctrl-head"><label for="spd">Steps / frame</label><span class="val" id="spd-v">2</span></div>
        <input type="range" id="spd" min="1" max="20" step="1" value="2">
      </div>
      <div class="row">
        <button type="button" class="primary" id="play">Pause</button>
        <button type="button" id="restart">Restart</button>
      </div>
    </div>

    <div class="grp">
      <div class="grp-title">View</div>
      <div class="ctrl">
        <div class="ctrl-head"><label for="e1">w₁ half-width</label><span class="val" id="e1-v">1.50</span></div>
        <input type="range" id="e1" min="0.2" max="6" step="0.1" value="1.5">
      </div>
      <div class="ctrl">
        <div class="ctrl-head"><label for="e2">w₂ half-width</label><span class="val" id="e2-v">11</span></div>
        <input type="range" id="e2" min="2" max="24" step="0.5" value="11">
      </div>
      <div class="ctrl">
        <div class="ctrl-head"><label for="elev">Elevation</label><span class="val" id="elev-v">22°</span></div>
        <input type="range" id="elev" min="-5" max="88" step="1" value="22">
      </div>
      <div class="toggle">
        <input type="checkbox" id="fit" checked>
        <label for="fit">Stretch axes to fit (distorts aspect)</label>
      </div>
    </div>
  </div>

  <div id="stage">
    <div id="view">
      <canvas id="cv"></canvas>
      <div class="overlay" id="readout"></div>
      <div class="overlay" id="note">drag to rotate · scroll to zoom</div>
    </div>
    <div id="plotwrap"><canvas id="plot"></canvas></div>
  </div>
</main>

<script>
(() => {
  "use strict";

  // ===========================================================================
  // Model.  True function is f_0 = 0; labels are pure noise, y_i = sigma * eps_i.
  // The empirical loss over n samples factorises exactly:
  //
  //     L(w1,w2) = C - w2 B(w1) + (1/2) w2^2 A(w1)
  //     A(a) = mean tanh^2(a x_i)      B(a) = mean y_i tanh(a x_i)
  //     C    = mean y_i^2 / 2
  //
  // so the whole 2-D landscape comes from two 1-D functions of w1.  With sigma=0
  // this is the population cross; with sigma>0 the cross is broken and the
  // minimum sits at some w != 0.  All derivatives below are analytic.
  // ===========================================================================

  let X = null, Y = null, N = 0, sigma = 0.3, seed = 1;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeData() {
    const rnd = mulberry32(seed * 7919 + 13);
    const gauss = () => {
      const u = Math.max(rnd(), 1e-12), v = rnd();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };
    X = new Float64Array(N); Y = new Float64Array(N);
    for (let i = 0; i < N; i++) { X[i] = gauss(); Y[i] = sigma * gauss(); }
  }

  // A, B and their first two derivatives, in one pass over the sample.
  const S = { A: 0, B: 0, A1: 0, B1: 0, A2: 0, B2: 0 };
  function stats(a, idx) {
    let A = 0, B = 0, A1 = 0, B1 = 0, A2 = 0, B2 = 0;
    const m = idx ? idx.length : N;
    for (let k = 0; k < m; k++) {
      const i = idx ? idx[k] : k;
      const x = X[i], y = Y[i];
      const t = Math.tanh(a * x), s = 1 - t * t;
      A  += t * t;
      B  += y * t;
      A1 += 2 * t * s * x;
      B1 += y * s * x;
      A2 += 2 * x * x * (s * s - 2 * t * t * s);
      B2 += -2 * y * t * s * x * x;
    }
    S.A = A / m; S.B = B / m; S.A1 = A1 / m;
    S.B1 = B1 / m; S.A2 = A2 / m; S.B2 = B2 / m;
    return S;
  }
  let Cconst = 0;
  function loss(a, b) { stats(a, null); return Cconst - b * S.B + 0.5 * b * b * S.A; }
  function grad(a, b, idx) {
    stats(a, idx);
    return [-b * S.B1 + 0.5 * b * b * S.A1, -S.B + b * S.A];
  }
  function sharpness(a, b) {
    stats(a, null);
    const h11 = -b * S.B2 + 0.5 * b * b * S.A2;
    const h12 = -S.B1 + b * S.A1;
    const h22 = S.A;
    const tr = h11 + h22, dt = h11 * h22 - h12 * h12;
    return 0.5 * (tr + Math.sqrt(Math.max(tr * tr - 4 * dt, 0)));
  }

  // ===========================================================================
  // State
  // ===========================================================================
  const el = (id) => document.getElementById(id);
  const cv = el("cv"), ctx = cv.getContext("2d");
  const plot = el("plot"), pctx = plot.getContext("2d");

  const BATCH = [4, 8, 16, 32, 64, 96, 128, 192, 256, 384, 0];   // 0 = full
  let lr = 0.05, batch = 0, speed = 2;
  let e1 = 1.5, e2 = 11, fitAxes = true;
  let yaw = 0.62, pitch = 22 * Math.PI / 180, zoom = 1;
  const RES = 96;
  let ax1, ax2, zs, kmax = 1, lmin = 0;
  let w = [1.2, 8.0], step = 0, running = true, diverged = false;
  let hist = [];                       // {step, loss, sharp}
  let path = [];                       // [w1, w2, L]
  const MAXPATH = 4000;
  const rndStep = mulberry32(20261);

  let RAMP = [], INK, INK2, INK3, LINE, PATHC, LIMITC, SURF;
  function readTokens() {
    const css = getComputedStyle(document.documentElement);
    const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16),
                        parseInt(h.slice(5, 7), 16)];
    RAMP = [];
    for (let i = 2; i <= 6; i++) RAMP.push(hex(css.getPropertyValue("--ramp-" + i).trim()));
    INK   = css.getPropertyValue("--ink").trim();
    INK2  = css.getPropertyValue("--ink-2").trim();
    INK3  = css.getPropertyValue("--ink-3").trim();
    LINE  = css.getPropertyValue("--line").trim();
    PATHC = css.getPropertyValue("--path").trim();
    LIMITC = css.getPropertyValue("--limit").trim();
    SURF  = css.getPropertyValue("--surface").trim();
  }
  function ramp(t) {
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const s = t * (RAMP.length - 1), i = Math.min(Math.floor(s), RAMP.length - 2);
    const f = s - i, a = RAMP[i], b = RAMP[i + 1];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f,
            a[2] + (b[2] - a[2]) * f];
  }

  function rebuildData() {
    makeData();
    let c = 0; for (let i = 0; i < N; i++) c += Y[i] * Y[i];
    Cconst = c / (2 * N);
    rebuildGrid();
  }

  function rebuildGrid() {
    const n = RES + 1;
    ax1 = new Float64Array(n); ax2 = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      ax1[i] = -e1 + (2 * e1 * i) / RES;
      ax2[i] = -e2 + (2 * e2 * i) / RES;
    }
    zs = new Float64Array(n * n); kmax = -Infinity; lmin = Infinity;
    for (let i = 0; i < n; i++) {
      stats(ax1[i], null);
      const A = S.A, B = S.B;
      for (let j = 0; j < n; j++) {
        const b = ax2[j];
        const v = Cconst - b * B + 0.5 * b * b * A;
        zs[i * n + j] = v;
        if (v > kmax) kmax = v;
        if (v < lmin) lmin = v;
      }
    }
  }

  function restart() {
    w = [1.2, 8.0]; step = 0; diverged = false;
    hist = []; path = [];
    record();
  }
  function record() {
    const L = loss(w[0], w[1]);
    hist.push({ step, loss: L, sharp: sharpness(w[0], w[1]) });
    path.push([w[0], w[1], L]);
    if (path.length > MAXPATH) path.shift();
    if (hist.length > 20000) hist.shift();
  }

  function advance(k) {
    for (let q = 0; q < k && !diverged; q++) {
      let idx = null;
      if (batch > 0 && batch < N) {
        idx = new Int32Array(batch);
        for (let i = 0; i < batch; i++) idx[i] = (rndStep() * N) | 0;
      }
      const gr = grad(w[0], w[1], idx);
      w = [w[0] - lr * gr[0], w[1] - lr * gr[1]];
      step++;
      if (!isFinite(w[0]) || !isFinite(w[1]) || Math.abs(w[0]) > 1e4 ||
          Math.abs(w[1]) > 1e4) { diverged = true; }
      record();
    }
  }

  // ===========================================================================
  // 3-D surface
  // ===========================================================================
  function project(W, H) {
    const cyw = Math.cos(yaw), syw = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    // "fit" stretches each axis to a common half-width so the w1 oscillation,
    // which is ~50x smaller than the w2 excursion, is actually visible.
    const s1 = fitAxes ? 1 / e1 : 1 / Math.max(e1, e2);
    const s2 = fitAxes ? 1 / e2 : 1 / Math.max(e1, e2);
    const span = kmax - lmin;
    const zU = span > 0 ? 1.0 / span : 1;
    const scale = Math.min(W, H) * 0.36 * zoom;
    const cx = W / 2, cyc = H / 2 + Math.min(W, H) * 0.13;
    return { cyw, syw, cp, sp, s1, s2, zU, scale, cx, cyc };
  }
  function to2d(P, x, y, z) {
    const X0 = x * P.s1, Y0 = y * P.s2, Z0 = (z - lmin) * P.zU;
    const u = X0 * P.cyw + Y0 * P.syw;
    const v = -X0 * P.syw + Y0 * P.cyw;
    return [P.cx + u * P.scale,
            P.cyc - (Z0 * P.cp + v * P.sp) * P.scale,
            -v * P.cp + Z0 * P.sp];
  }

  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W * dpr || cv.height !== H * dpr) {
      cv.width = W * dpr; cv.height = H * dpr;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const n = RES + 1, P = project(W, H);
    const px = new Float64Array(n * n), py = new Float64Array(n * n),
          pd = new Float64Array(n * n);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const q = to2d(P, ax1[i], ax2[j], zs[i * n + j]);
        const k = i * n + j;
        px[k] = q[0]; py[k] = q[1]; pd[k] = q[2];
      }
    }

    const nq = RES * RES, key = new Float64Array(nq), ord = new Array(nq);
    for (let i = 0; i < RES; i++) {
      for (let j = 0; j < RES; j++) {
        const q = i * RES + j; ord[q] = q;
        key[q] = 0.25 * (pd[i * n + j] + pd[(i + 1) * n + j] +
                         pd[(i + 1) * n + j + 1] + pd[i * n + j + 1]);
      }
    }
    ord.sort((a, b) => key[a] - key[b]);

    const span = kmax - lmin || 1;
    for (let q = 0; q < nq; q++) {
      const t = ord[q], i = (t / RES) | 0, j = t % RES;
      const a = i * n + j, b = (i + 1) * n + j,
            c = (i + 1) * n + j + 1, d = i * n + j + 1;
      const zm = 0.25 * (zs[a] + zs[b] + zs[c] + zs[d]);
      const col = ramp((zm - lmin) / span);
      const sh = 0.78 + 0.22 * (1 - (zm - lmin) / span);
      ctx.fillStyle = "rgb(" + (col[0] * sh | 0) + "," + (col[1] * sh | 0) + "," +
                      (col[2] * sh | 0) + ")";
      ctx.beginPath();
      ctx.moveTo(px[a], py[a]); ctx.lineTo(px[b], py[b]);
      ctx.lineTo(px[c], py[c]); ctx.lineTo(px[d], py[d]);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.6; ctx.stroke();
    }

    // Trajectory, drawn over the surface rather than depth-sorted into it, so it
    // stays visible when it dips below the near edge.
    if (path.length > 1) {
      ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath();
      for (let i = 0; i < path.length; i++) {
        const q = to2d(P, path[i][0], path[i][1], path[i][2]);
        if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
      }
      ctx.strokeStyle = SURF; ctx.lineWidth = 3.4; ctx.stroke();
      ctx.strokeStyle = PATHC; ctx.lineWidth = 1.6; ctx.stroke();

      const cur = to2d(P, w[0], w[1], loss(w[0], w[1]));
      ctx.beginPath(); ctx.arc(cur[0], cur[1], 5, 0, 2 * Math.PI);
      ctx.fillStyle = PATHC; ctx.fill();
      ctx.strokeStyle = SURF; ctx.lineWidth = 1.6; ctx.stroke();
    }

    // Footprint box + axis labels.
    ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.beginPath();
    const cor = [[-e1, -e2], [e1, -e2], [e1, e2], [-e1, e2]];
    for (let k = 0; k < 4; k++) {
      const p = to2d(P, cor[k][0], cor[k][1], lmin);
      const r = to2d(P, cor[(k + 1) % 4][0], cor[(k + 1) % 4][1], lmin);
      ctx.moveTo(p[0], p[1]); ctx.lineTo(r[0], r[1]);
    }
    ctx.stroke();
    ctx.fillStyle = INK3; ctx.font = "500 11px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const l1 = to2d(P, e1 * 1.2, 0, lmin), l2 = to2d(P, 0, e2 * 1.2, lmin);
    ctx.fillText("w₁", l1[0], l1[1]);
    ctx.fillText("w₂", l2[0], l2[1]);

    drawReadout();
  }

  function drawReadout() {
    const sh = sharpness(w[0], w[1]), lim = 2 / lr;
    const hot = sh > lim * 0.97;
    el("readout").innerHTML =
      '<span class="k">step</span> ' + step +
      '   <span class="k">L</span> ' + loss(w[0], w[1]).toExponential(3) + "<br>" +
      '<span class="k">w</span> (' + w[0].toFixed(4) + ", " + w[1].toFixed(4) + ")<br>" +
      '<span class="k">sharpness</span> <span class="' + (hot ? "hot" : "") + '">' +
      sh.toFixed(2) + "</span>" +
      '   <span class="k">2/η</span> ' + lim.toFixed(2) +
      (diverged ? '<br><span class="hot">diverged</span>' : "");
  }

  // ===========================================================================
  // Sharpness trace — the edge-of-stability plot
  // ===========================================================================
  function drawPlot() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = plot.clientWidth, H = plot.clientHeight;
    if (plot.width !== W * dpr || plot.height !== H * dpr) {
      plot.width = W * dpr; plot.height = H * dpr;
    }
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.clearRect(0, 0, W, H);

    const L = 52, R = 14, T = 16, B = 26;
    const lim = 2 / lr;
    let hi = lim * 1.35, lo = 0;
    for (const h of hist) if (h.sharp > hi) hi = h.sharp * 1.05;
    const nsteps = Math.max(hist.length, 2);
    const sx = (i) => L + (i / (nsteps - 1)) * (W - L - R);
    const sy = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

    pctx.strokeStyle = LINE; pctx.lineWidth = 1;
    pctx.beginPath(); pctx.moveTo(L, T); pctx.lineTo(L, H - B); pctx.lineTo(W - R, H - B);
    pctx.stroke();

    pctx.fillStyle = INK3; pctx.font = "10px ui-monospace, Menlo, monospace";
    pctx.textAlign = "right"; pctx.textBaseline = "middle";
    for (let g = 0; g <= 3; g++) {
      const v = lo + (hi - lo) * g / 3;
      pctx.fillText(v.toFixed(0), L - 6, sy(v));
      pctx.strokeStyle = LINE; pctx.globalAlpha = 0.6;
      pctx.beginPath(); pctx.moveTo(L, sy(v)); pctx.lineTo(W - R, sy(v)); pctx.stroke();
      pctx.globalAlpha = 1;
    }

    // 2/eta — the stability threshold
    pctx.strokeStyle = LIMITC; pctx.lineWidth = 1.4; pctx.setLineDash([5, 4]);
    pctx.beginPath(); pctx.moveTo(L, sy(lim)); pctx.lineTo(W - R, sy(lim)); pctx.stroke();
    pctx.setLineDash([]);
    pctx.fillStyle = LIMITC; pctx.textAlign = "left"; pctx.textBaseline = "bottom";
    pctx.fillText("2/η = " + lim.toFixed(1), L + 6, sy(lim) - 3);

    if (hist.length > 1) {
      pctx.strokeStyle = PATHC; pctx.lineWidth = 1.6; pctx.beginPath();
      for (let i = 0; i < hist.length; i++) {
        const x = sx(i), y = sy(hist[i].sharp);
        if (i === 0) pctx.moveTo(x, y); else pctx.lineTo(x, y);
      }
      pctx.stroke();
    }

    pctx.fillStyle = INK3; pctx.textAlign = "left"; pctx.textBaseline = "top";
    pctx.fillText("sharpness  λmax(∇²L)", L + 6, 2);
    pctx.textAlign = "right"; pctx.textBaseline = "top";
    pctx.fillText("step " + step, W - R, H - B + 8);
  }

  // ===========================================================================
  // Loop + controls
  // ===========================================================================
  function frame() {
    if (running && !diverged) advance(speed);
    draw(); drawPlot();
    requestAnimationFrame(frame);
  }

  function bind(id, fmt, fn) {
    const inp = el(id), out = el(id + "-v");
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      out.textContent = fmt(v); fn(v);
    });
  }
  bind("n", (v) => v, (v) => { N = v; rebuildData(); restart(); });
  bind("sig", (v) => v.toFixed(2), (v) => { sigma = v; rebuildData(); restart(); });
  bind("seed", (v) => v, (v) => { seed = v; rebuildData(); restart(); });
  bind("lr", (v) => v.toFixed(3), (v) => { lr = v; });
  bind("bs", (v) => (BATCH[v] === 0 ? "full" : BATCH[v]), (v) => { batch = BATCH[v]; });
  bind("spd", (v) => v, (v) => { speed = v; });
  bind("e1", (v) => v.toFixed(2), (v) => { e1 = v; rebuildGrid(); });
  bind("e2", (v) => v.toFixed(0), (v) => { e2 = v; rebuildGrid(); });
  bind("elev", (v) => v + "°", (v) => { pitch = v * Math.PI / 180; });

  el("fit").addEventListener("change", (e) => { fitAxes = e.target.checked; });
  el("play").addEventListener("click", () => {
    running = !running;
    el("play").textContent = running ? "Pause" : "Play";
  });
  el("restart").addEventListener("click", () => {
    restart(); running = true; el("play").textContent = "Pause";
  });

  let drag = false, lx = 0, ly = 0;
  cv.addEventListener("pointerdown", (e) => {
    drag = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", (e) => {
    if (!drag) return;
    yaw += (e.clientX - lx) * 0.008;
    pitch = Math.max(-0.09, Math.min(1.53, pitch - (e.clientY - ly) * 0.006));
    lx = e.clientX; ly = e.clientY;
    const deg = Math.round(pitch * 180 / Math.PI);
    el("elev").value = deg; el("elev-v").textContent = deg + "°";
  });
  cv.addEventListener("pointerup", (e) => {
    drag = false; cv.releasePointerCapture(e.pointerId);
  });
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoom = Math.max(0.3, Math.min(6, zoom * Math.exp(-e.deltaY * 0.0016)));
  }, { passive: false });

  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener("change", readTokens);
  new MutationObserver(readTokens)
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  readTokens();
  N = parseInt(el("n").value, 10);
  batch = BATCH[parseInt(el("bs").value, 10)];
  rebuildData();
  restart();
  frame();
})();
</script>
